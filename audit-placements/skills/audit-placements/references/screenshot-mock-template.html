<!--
  HTML mock template for audit-placements Step 5d.

  CORE RULE: render the WHOLE COMPONENT, not just the inner text.
  - Modal mock = backdrop + frame + header + body + primary CTA + secondary CTA + dismiss X
  - Card mock = brand mark + title + body + action button(s) (don't omit CTAs even if surface usually has none — note it as "no CTA" via comment instead)
  - Banner mock = full banner including icon, copy, dismiss
  A "text-only" mock is a failed mock — the reader can't compare CTA copy
  next to dismiss copy, can't see hierarchy, can't tell if the body wraps.

  Fill in placeholders marked {{ ... }} with production strings copied verbatim
  from the surface's YAML / view layout / resolver. Save as <slug>-mock.html
  and render with chromium headless:

    chromium --headless --disable-gpu --hide-scrollbars \
      --window-size=640,520 \
      --screenshot=/home/bento/snap/chromium/common/screenshots/<slug>-mock.png \
      "file://$PWD/<slug>-mock.html"

  Window-size guide: card 580×220, banner 580×120, modal 640×520.

  Three variants below — pick the one matching the surface family.
  Brand marks: Mastercard (red+orange circles), IC+ (green pill), generic square.

  Always include the literal MOCK label in the doc cell caption.
  Never let a mock pass for a real prod capture.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #F6F7F8; }
  body { padding: 16px; font-family: -apple-system, system-ui, sans-serif; color: #242529; }
  * { box-sizing: border-box; }

  /* === Shared brand marks === */
  .mark-mastercard { width: 42px; height: 30px; background: #fff; border: 1px solid #E8E9EB; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mark-mastercard span:first-child { display: inline-block; width: 14px; height: 14px; background: #EB001B; border-radius: 50%; margin-right: -6px; }
  .mark-mastercard span:last-child  { display: inline-block; width: 14px; height: 14px; background: #F79E1B; border-radius: 50%; opacity: 0.85; }
  .mark-icplus { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: #0AAD0A; color: #fff; border-radius: 10px; font-weight: 700; font-size: 10px; letter-spacing: 0.5px; flex-shrink: 0; }
  .mark-generic { width: 32px; height: 32px; background: #E8E9EB; border-radius: 6px; flex-shrink: 0; }

  /* === Shared button styles === */
  .btn-primary { display: inline-block; padding: 10px 18px; background: #0AAD0A; color: #fff; border-radius: 24px; font-weight: 600; font-size: 13px; text-decoration: none; border: none; cursor: pointer; }
  .btn-secondary { display: inline-block; padding: 10px 18px; background: transparent; color: #0AAD0A; border-radius: 24px; font-weight: 600; font-size: 13px; text-decoration: none; border: 1.5px solid #0AAD0A; cursor: pointer; }
  .btn-link { color: #6F7378; font-size: 13px; text-decoration: underline; cursor: pointer; }
  .dismiss-x { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; color: #6F7378; font-size: 18px; cursor: pointer; background: none; border: none; line-height: 1; }

  /* === Variant 1: Card / tile === */
  .placement-card { background: #fff; border: 1px solid #E8E9EB; border-radius: 12px; padding: 18px 20px; width: 540px; display: flex; align-items: flex-start; gap: 14px; position: relative; }
  .placement-card .body { flex: 1; }
  .placement-card .title { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .placement-card .subtitle { margin-top: 4px; color: #6F7378; font-size: 13px; line-height: 1.4; }
  .placement-card .actions { margin-top: 14px; display: flex; gap: 8px; align-items: center; }

  /* === Variant 2: Cart banner === */
  .cart-banner { background: #FFF8E1; border-left: 4px solid #FFB300; padding: 14px 16px; width: 540px; font-size: 13px; line-height: 1.4; display: flex; gap: 12px; align-items: center; position: relative; }
  .cart-banner .icon { width: 24px; height: 24px; flex-shrink: 0; background: #FFB300; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .cart-banner .copy { flex: 1; }
  .cart-banner .cta-inline { color: #0AAD0A; font-weight: 600; text-decoration: underline; cursor: pointer; }

  /* === Variant 3: Modal === */
  .modal-overlay { background: rgba(0,0,0,0.55); width: 600px; height: 480px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
  .modal-body { background: #fff; border-radius: 16px; padding: 28px 28px 24px; width: 440px; box-shadow: 0 8px 32px rgba(0,0,0,0.24); position: relative; }
  .modal-body .modal-icon { width: 64px; height: 64px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; background: #F6F7F8; border-radius: 50%; }
  .modal-body h2 { margin: 0 0 10px; font-size: 20px; font-weight: 700; text-align: center; }
  .modal-body p.body-copy { margin: 0 0 22px; color: #4F5256; font-size: 14px; line-height: 1.5; text-align: center; }
  .modal-body ul.benefits { margin: 0 0 22px; padding: 0; list-style: none; }
  .modal-body ul.benefits li { padding: 6px 0; font-size: 13px; color: #242529; display: flex; gap: 8px; align-items: flex-start; }
  .modal-body ul.benefits li::before { content: "✓"; color: #0AAD0A; font-weight: 700; flex-shrink: 0; }
  .modal-body .modal-actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .modal-body .modal-actions .btn-primary,
  .modal-body .modal-actions .btn-secondary { text-align: center; padding: 12px 18px; font-size: 14px; }
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- VARIANT 1 — Card / tile                                      -->
<!-- Use for: account-page benefit tile, offer card, storefront   -->
<!--   credit-back card, EPP express_offer_card placements        -->
<!-- Swap .mark-mastercard for .mark-icplus or .mark-generic      -->
<!-- ============================================================ -->
<div class="placement-card">
  <span class="mark-mastercard"><span></span><span></span></span>
  <div class="body">
    <div class="title">{{ TITLE — e.g. "$20 Instacart credit each month" }}</div>
    <div class="subtitle">{{ SUBTITLE / BODY — e.g. "Applies to your second order each month. Active Instacart+ membership and eligible Mastercard required." }}</div>
    <div class="actions">
      <a class="btn-primary">{{ PRIMARY CTA — e.g. "Redeem now" }}</a>
      <a class="btn-link">{{ SECONDARY LINK — e.g. "Learn more" — delete if surface has none }}</a>
    </div>
  </div>
  <button class="dismiss-x" aria-label="Dismiss">×</button>
</div>
